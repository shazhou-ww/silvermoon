name: Publish npm package

on:
  push:
    tags:
      - "npm/**"

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Refresh primary branch and verify ancestry
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install trusted-publishing npm
        run: npm install --global npm@11.6.2 && npm --version

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release instruction
        id: release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node scripts/prepare-npm-release.mjs
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT"

      - name: Validate CLI syntax
        run: node --check bin/silvermoon.js

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run contract tests
        run: pnpm test:contract

      - name: Run integration tests
        run: pnpm test:integration

      - name: Discover agent skills
        run: pnpm check:skills

      - name: Validate local static checks
        run: |
          pnpm lint:markdown
          pnpm check:diff
          node bin/silvermoon.js check --commit HEAD --audience agent

      - name: Stage selected package
        id: stage
        env:
          PACKAGE_DIRECTORY: ${{ steps.release.outputs.package_directory }}
        run: |
          STAGE_ROOT="$RUNNER_TEMP/npm-stage"
          ARTIFACT_DIRECTORY="$RUNNER_TEMP/npm-artifacts"
          mkdir -p "$STAGE_ROOT" "$ARTIFACT_DIRECTORY"
          git archive "$GITHUB_SHA" | tar -x -C "$STAGE_ROOT"
          PACKAGE_ROOT="$(cd "$STAGE_ROOT/$PACKAGE_DIRECTORY" && pwd)"
          echo "package_directory=$PACKAGE_ROOT" >> "$GITHUB_OUTPUT"
          echo "artifact_directory=$ARTIFACT_DIRECTORY" >> "$GITHUB_OUTPUT"

      - name: Generate immutable npm README
        working-directory: ${{ steps.stage.outputs.package_directory }}
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node "${{ github.workspace }}/scripts/generate-npm-readme.mjs" \
            --commit "$RELEASE_COMMIT" --source README.md --out README.md
          node "${{ github.workspace }}/scripts/generate-npm-readme.mjs" \
            --commit "$RELEASE_COMMIT" --source README.zh-CN.md --out README.zh-CN.md

      - name: Build selected package tarball
        id: package
        env:
          PACKAGE_DIRECTORY: ${{ steps.stage.outputs.package_directory }}
          ARTIFACT_DIRECTORY: ${{ steps.stage.outputs.artifact_directory }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          node scripts/build-npm-tarball.mjs
          --package-directory "$PACKAGE_DIRECTORY"
          --output-directory "$ARTIFACT_DIRECTORY"
          --git-head "$RELEASE_COMMIT"

      - name: Verify selected package tarball
        working-directory: ${{ steps.stage.outputs.package_directory }}
        env:
          SILVERMOON_TARBALL: ${{ steps.package.outputs.tarball_path }}
          SILVERMOON_TARBALL_SHA256: ${{ steps.package.outputs.tarball_sha256 }}
          SILVERMOON_TARBALL_INTEGRITY: ${{ steps.package.outputs.tarball_integrity }}
          SILVERMOON_RELEASE_COMMIT: ${{ github.sha }}
        run: npm run pack:check

      - name: Test installed package
        working-directory: ${{ steps.stage.outputs.package_directory }}
        env:
          SILVERMOON_TARBALL: ${{ steps.package.outputs.tarball_path }}
        run: npm run test:e2e

      - name: Publish selected package
        if: steps.release.outputs.publication_state == 'absent'
        working-directory: ${{ steps.stage.outputs.package_directory }}
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          SILVERMOON_TARBALL: ${{ steps.package.outputs.tarball_path }}
          SILVERMOON_TARBALL_SHA256: ${{ steps.package.outputs.tarball_sha256 }}
        run: |
          echo "$SILVERMOON_TARBALL_SHA256  $SILVERMOON_TARBALL" |
            sha256sum --check --strict -
          npm publish . \
            --access public --provenance --tag "$NPM_DIST_TAG"

      - name: Verify published package
        working-directory: ${{ steps.stage.outputs.package_directory }}
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          SILVERMOON_TARBALL: ${{ steps.package.outputs.tarball_path }}
        run: >-
          node "${{ github.workspace }}/scripts/verify-npm-release.mjs"
          --package-name "$PACKAGE_NAME"
          --version "$PACKAGE_VERSION"
          --dist-tag "$NPM_DIST_TAG"
          --commit "$RELEASE_COMMIT"
          --tag "$RELEASE_TAG"
          --tarball "$SILVERMOON_TARBALL"