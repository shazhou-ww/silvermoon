name: Publish npm package

on:
  push:
    tags:
      - "npm/**"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare-canary:
    name: Prepare daily canary
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.NPM_RELEASE_DEPLOY_KEY }}

      - name: Refresh and verify primary head
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Plan canary publication
        id: canary
        run: >-
          node bin/prepare-npm-release.ts
          --channel canary
          --run-number "$GITHUB_RUN_NUMBER"
          --commit "$GITHUB_SHA"

      - name: Record unchanged canary
        if: steps.canary.outputs.publication_state == 'unchanged'
        run: |
          echo "The current origin/main commit is already published on the npm canary channel." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Create immutable canary tag or resume publication
        if: steps.canary.outputs.publication_state != 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.canary.outputs.version }}
        run: |
          RELEASE_TAG="npm/silvermoon/v$PACKAGE_VERSION"
          REMOTE_COMMIT="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          if [ -n "$REMOTE_COMMIT" ]; then
            test "$REMOTE_COMMIT" = "$GITHUB_SHA"
            gh workflow run publish-npm.yml --ref "$RELEASE_TAG"
            echo "Dispatched existing $RELEASE_TAG from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
            echo "Created $RELEASE_TAG from $GITHUB_SHA; its push dispatches publication." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/npm/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve publication source
        id: source
        env:
          RELEASE_SOURCE_TAG: ${{ github.ref_name }}
        run: |
          PLANNER_TAG="$RELEASE_SOURCE_TAG"
          RECOVERY_STATE=ordinary
          SOURCE_REF="$GITHUB_REF"
          if [ "$RELEASE_SOURCE_TAG" = "npm/silvermoon-recovery/v0.4.0" ]; then
            PLANNER_TAG=npm/silvermoon/v0.4.0
            RECOVERY_STATE=0.4.0
          fi
          echo "planner_tag=$PLANNER_TAG" >> "$GITHUB_OUTPUT"
          echo "recovery_state=$RECOVERY_STATE" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

      - name: Refresh and verify primary branch
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Verify 0.4.0 recovery ancestry
        if: steps.source.outputs.recovery_state == '0.4.0'
        env:
          ORIGINAL_RELEASE_COMMIT: 9501f2f4887c360f0902f559e7c6456ffe72b43d
        run: |
          git fetch --no-tags origin \
            "+refs/tags/npm/silvermoon/v0.4.0:refs/tags/npm/silvermoon/v0.4.0"
          test "$(git rev-parse 'refs/tags/npm/silvermoon/v0.4.0^{commit}')" = \
            "$ORIGINAL_RELEASE_COMMIT"
          git merge-base --is-ancestor "$ORIGINAL_RELEASE_COMMIT" "$GITHUB_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install trusted-publishing npm
        run: npm install --global npm@11.6.2 && npm --version

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release instruction
        id: release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.source.outputs.planner_tag }}
        run: >-
          node bin/prepare-npm-release.ts
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT"

      - name: Build repository
        if: steps.release.outputs.publication_state != 'unchanged'
        run: pnpm build

      - name: Run unit tests
        if: steps.release.outputs.publication_state != 'unchanged'
        run: pnpm test:unit

      - name: Run contract tests
        if: steps.release.outputs.publication_state != 'unchanged'
        run: pnpm test:contract

      - name: Run integration tests
        if: steps.release.outputs.publication_state != 'unchanged'
        run: pnpm test:integration:all

      - name: Discover agent skills
        if: steps.release.outputs.publication_state != 'unchanged'
        run: pnpm check:skills

      - name: Validate local static checks
        if: steps.release.outputs.publication_state != 'unchanged'
        run: |
          pnpm lint:markdown
          pnpm check:diff
          node bin/silvermoon.ts check --commit HEAD --audience agent

      - name: Stage selected package
        id: stage
        if: steps.release.outputs.publication_state != 'unchanged'
        env:
          PACKAGE_DIRECTORY: ${{ steps.release.outputs.package_directory }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          STAGE_ROOT="$RUNNER_TEMP/npm-stage"
          ARTIFACT_DIRECTORY="$RUNNER_TEMP/npm-artifacts"
          mkdir -p "$STAGE_ROOT" "$ARTIFACT_DIRECTORY"
          git archive "$GITHUB_SHA" | tar -x -C "$STAGE_ROOT"
          PACKAGE_ROOT="$(cd "$STAGE_ROOT/$PACKAGE_DIRECTORY" && pwd)"
          if [ "$NPM_DIST_TAG" = "canary" ]; then
            node "$GITHUB_WORKSPACE/bin/stage-npm-canary.ts" \
              --package-directory "$PACKAGE_ROOT" \
              --version "$PACKAGE_VERSION"
          fi
          echo "package_directory=$PACKAGE_ROOT" >> "$GITHUB_OUTPUT"
          echo "artifact_directory=$ARTIFACT_DIRECTORY" >> "$GITHUB_OUTPUT"

      - name: Build selected package
        if: steps.release.outputs.publication_state != 'unchanged'
        working-directory: ${{ steps.stage.outputs.package_directory }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Generate immutable npm README
        if: steps.release.outputs.publication_state != 'unchanged'
        working-directory: ${{ steps.stage.outputs.package_directory }}
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node "${{ github.workspace }}/bin/generate-npm-readme.ts" \
            --commit "$RELEASE_COMMIT" --source README.md --out README.md
          node "${{ github.workspace }}/bin/generate-npm-readme.ts" \
            --commit "$RELEASE_COMMIT" --source README.zh-CN.md --out README.zh-CN.md

      - name: Build selected package tarball
        id: package
        if: steps.release.outputs.publication_state != 'unchanged'
        env:
          PACKAGE_DIRECTORY: ${{ steps.stage.outputs.package_directory }}
          ARTIFACT_DIRECTORY: ${{ steps.stage.outputs.artifact_directory }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          node bin/build-npm-tarball.ts
          --package-directory "$PACKAGE_DIRECTORY"
          --output-directory "$ARTIFACT_DIRECTORY"
          --git-head "$RELEASE_COMMIT"

      - name: Verify selected package tarball
        if: steps.release.outputs.publication_state != 'unchanged'
        working-directory: ${{ steps.stage.outputs.package_directory }}
        env:
          SILVERMOON_TARBALL: ${{ steps.package.outputs.tarball_path }}
          SILVERMOON_TARBALL_SHA256: ${{ steps.package.outputs.tarball_sha256 }}
          SILVERMOON_TARBALL_INTEGRITY: ${{ steps.package.outputs.tarball_integrity }}
          SILVERMOON_RELEASE_COMMIT: ${{ github.sha }}
        run: npm run pack:check

      - name: Test installed package
        if: steps.release.outputs.publication_state != 'unchanged'
        working-directory: ${{ steps.stage.outputs.package_directory }}
        env:
          SILVERMOON_TARBALL: ${{ steps.package.outputs.tarball_path }}
        run: npm run test:e2e

      - name: Publish selected package
        if: steps.release.outputs.publication_state == 'absent'
        working-directory: ${{ steps.stage.outputs.package_directory }}
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          SILVERMOON_TARBALL: ${{ steps.package.outputs.tarball_path }}
          SILVERMOON_TARBALL_SHA256: ${{ steps.package.outputs.tarball_sha256 }}
        run: |
          echo "$SILVERMOON_TARBALL_SHA256  $SILVERMOON_TARBALL" |
            sha256sum --check --strict -
          npm publish . \
            --access public --provenance --tag "$NPM_DIST_TAG"

      - name: Verify published package
        if: steps.release.outputs.publication_state != 'unchanged'
        working-directory: ${{ steps.stage.outputs.package_directory }}
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          SILVERMOON_TARBALL: ${{ steps.package.outputs.tarball_path }}
        run: >-
          node "${{ github.workspace }}/bin/verify-npm-release.ts"
          --package-name "$PACKAGE_NAME"
          --version "$PACKAGE_VERSION"
          --dist-tag "$NPM_DIST_TAG"
          --commit "$RELEASE_COMMIT"
          --source-ref "$RELEASE_SOURCE_REF"
          --tarball "$SILVERMOON_TARBALL"