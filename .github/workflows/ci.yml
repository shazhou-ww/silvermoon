name: CI

on:
  pull_request:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-risk:
    name: Select package validation conservatively
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.risk.outputs.required }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Observe package risk
        id: risk
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = pull_request ]; then
            node bin/ci-package-risk.ts --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node bin/ci-package-risk.ts --full
          fi

  unit:
    name: Unit - Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run sanity checks
        run: pnpm check:sanity

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run platform integration smoke
        run: pnpm test:integration:platform:built

  contract:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run contract tests
        run: pnpm test:contract

      - name: Discover skills
        run: pnpm check:skills

      - name: Lint Markdown
        run: pnpm lint:markdown

      - name: Validate checked-out Silvermoon snapshot
        run: |
          git remote set-url origin https://github.com/shazhou-ww/silvermoon.git
          git fetch --no-tags origin main
          node bin/silvermoon.ts check --commit HEAD --audience agent

      - name: Check whitespace
        run: pnpm check:diff

  integration:
    name: Fast Git integration - Node 24 on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fast integration tests
        run: pnpm test:integration

  integration-extended:
    name: Extended Git integration - Node 24 on Ubuntu
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run extended integration tests
        run: pnpm test:integration:extended

  package:
    name: Package contents and installed CLI
    needs: package-risk
    if: needs.package-risk.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package contents
        run: pnpm pack:check

      - name: Test installed package
        run: pnpm test:e2e

  required:
    name: Required checks
    if: ${{ always() }}
    needs:
      - package-risk
      - unit
      - contract
      - integration
      - integration-extended
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE_REQUIRED: ${{ needs.package-risk.outputs.required }}
          PACKAGE_RISK_RESULT: ${{ needs.package-risk.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          EXTENDED_INTEGRATION_RESULT: ${{ needs.integration-extended.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          for result in \
            "$PACKAGE_RISK_RESULT" \
            "$UNIT_RESULT" \
            "$CONTRACT_RESULT" \
            "$INTEGRATION_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "Required CI job result was $result."
              exit 1
            fi
          done

          case "$EVENT_NAME:$EXTENDED_INTEGRATION_RESULT" in
            pull_request:skipped|schedule:success|workflow_dispatch:success)
              ;;
            *)
              echo "Extended integration result was inconsistent with event $EVENT_NAME."
              exit 1
              ;;
          esac

          case "$PACKAGE_REQUIRED:$PACKAGE_RESULT" in
            true:success|false:skipped)
              ;;
            *)
              echo "Package validation result was inconsistent with risk selection."
              exit 1
              ;;
          esac