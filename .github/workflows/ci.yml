name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-risk:
    name: Select package validation conservatively
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.risk.outputs.required }}
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Observe package risk
        id: risk
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = pull_request ]; then
            node scripts/ci-package-risk.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node scripts/ci-package-risk.mjs --full
          fi

  unit:
    name: Unit - Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run sanity checks
        run: pnpm check:sanity

      - name: Run unit tests
        run: pnpm test:unit

  contract:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run contract tests
        run: pnpm test:contract

      - name: Discover skills
        run: pnpm check:skills

      - name: Lint Markdown
        run: pnpm lint:markdown

      - name: Validate checked-out Silvermoon snapshot
        run: node bin/silvermoon.js check --commit HEAD --audience agent

      - name: Check whitespace
        run: pnpm check:diff

  integration:
    name: Git integration - Node 24 on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test:integration

  package:
    name: Package contents and installed CLI
    needs: package-risk
    if: needs.package-risk.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package contents
        run: pnpm pack:check

      - name: Test installed package
        run: pnpm test:e2e

  required:
    name: Required checks
    if: ${{ always() }}
    needs:
      - package-risk
      - unit
      - contract
      - integration
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          PACKAGE_REQUIRED: ${{ needs.package-risk.outputs.required }}
          PACKAGE_RISK_RESULT: ${{ needs.package-risk.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          for result in \
            "$PACKAGE_RISK_RESULT" \
            "$UNIT_RESULT" \
            "$CONTRACT_RESULT" \
            "$INTEGRATION_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "Required CI job result was $result."
              exit 1
            fi
          done

          case "$PACKAGE_REQUIRED:$PACKAGE_RESULT" in
            true:success|false:skipped)
              ;;
            *)
              echo "Package validation result was inconsistent with risk selection."
              exit 1
              ;;
          esac